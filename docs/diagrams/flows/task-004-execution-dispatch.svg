<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="When a response is lost the try stays open, and recovery reuses the same run ID"><style>
:root{--bg:#fff;--ink:#14213d;--muted:#5b6780;--line:#c9d2e0;--node:#fff;--band:#f4f6fa;
--blue:#1d6fd8;--blue-bg:#eaf2fd;--green:#14804a;--green-bg:#e7f6ee;--red:#c22f3d;--red-bg:#fdecee;--amber:#b35c00;--amber-bg:#fff3e2;--violet:#6a3fc8;--violet-bg:#f1ecfc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa7b8;--line:#3a4557;--node:#161b22;--band:#161b22;
--blue:#6cb0ff;--blue-bg:#14263f;--green:#4cc98a;--green-bg:#10291e;--red:#ff7b86;--red-bg:#33161a;--amber:#f0a94b;--amber-bg:#33240f;--violet:#b49bff;--violet-bg:#231a3f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:40px;font-weight:800}.sub{font-size:20px;fill:var(--muted)}
.name{font-size:23px;font-weight:700;text-anchor:middle}.note{font-size:17px;fill:var(--muted);text-anchor:middle}
.label{font-size:16px;fill:var(--muted);text-anchor:middle}.point{font-size:22px;font-weight:700}.foot{font-size:16px;fill:var(--muted)}
.state{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:700;text-anchor:middle}
</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--blue)"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--green)"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red)"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--amber)"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet)"/></marker><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker></defs><rect width="1200" height="612" rx="18" fill="var(--bg)"/><text class="title" x="40" y="66">What if the response is lost?</text><text class="sub" x="40" y="100">Execution dispatch: save first, then call the job system.</text><rect x="40" y="240" width="220" height="130" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="150" y="291">1. Save first</text><text class="note" x="150" y="319">Try and run ID</text><text class="note" x="150" y="342">COMMIT</text><rect x="310" y="240" width="240" height="130" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="430" y="302.5">2. Call job system</text><text class="note" x="430" y="330.5">no open transaction</text><path d="M260 305H308" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><path d="M550 305C590 305 580 186 618 186" fill="none" stroke="var(--green)" stroke-width="3" marker-end="url(#m-green)"/><path d="M550 305C590 305 580 310 618 310" fill="none" stroke="var(--red)" stroke-width="3" marker-end="url(#m-red)"/><path d="M550 305C590 305 580 434 618 434" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><rect x="620" y="136" width="250" height="100" rx="14" fill="var(--green-bg)" stroke="var(--green)" stroke-width="2.5"/><text class="name" x="745" y="168" style="fill:var(--green)">Accepted</text><text class="state" x="745" y="196">ACCEPTED</text><text class="note" x="745" y="220">Job RUNNING</text><rect x="620" y="260" width="250" height="100" rx="14" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2.5"/><text class="name" x="745" y="292" style="fill:var(--red)">Rejected</text><text class="state" x="745" y="320">DISPATCH_FAILED</text><text class="note" x="745" y="344">No run exists</text><rect x="620" y="384" width="250" height="100" rx="14" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.5"/><text class="name" x="745" y="416" style="fill:var(--amber)">Unknown</text><text class="state" x="745" y="444">DISPATCHING</text><text class="note" x="745" y="468">Same try stays open</text><path d="M870 310H918" fill="none" stroke="var(--red)" stroke-width="3" marker-end="url(#m-red)"/><rect x="920" y="260" width="240" height="100" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="1040" y="307.5">Run again</text><text class="note" x="1040" y="335.5">new try</text><path d="M870 434H918" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><rect x="920" y="384" width="240" height="100" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="1040" y="431.5">Run or Reconcile</text><text class="note" x="1040" y="459.5">same run ID</text><rect x="40" y="508" width="1120" height="84" rx="14" fill="var(--band)"/><text class="point" x="64" y="544">Unknown isn't failure. Recovery keeps the run ID, so nothing runs twice.</text><text class="foot" x="64" y="572">This needs the job system to honor the run ID. The simulator does; a real one must too.</text></svg>
