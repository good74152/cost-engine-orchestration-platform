<text x="53" y="197" font-size="17" font-weight="700" fill="#fff">1</text>
<text x="84" y="195" font-size="21" font-weight="700" fill="#172b4d">Job Running</text>
<text x="84" y="221" font-size="17" font-weight="400" fill="#42526b">Job RUNNING · Attempt ACCEPTED</text>
<text x="84" y="243" font-size="17" font-weight="400" fill="#42526b">Executor: RUNNING</text>
<rect x="32" y="262" width="360" height="92" rx="12" fill="#f0f5fc" stroke="#bacbe0"/>
<circle cx="58" cy="289" r="15" fill="#176270" stroke="#176270"/>
