<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Reconcile reads the saved run ID, asks the job system outside a transaction, then either saves the result or changes nothing"><style>
:root{--bg:#fff;--ink:#14213d;--muted:#5b6780;--line:#c9d2e0;--node:#fff;--band:#f4f6fa;
--blue:#1d6fd8;--blue-bg:#eaf2fd;--green:#14804a;--green-bg:#e7f6ee;--red:#c22f3d;--red-bg:#fdecee;--amber:#b35c00;--amber-bg:#fff3e2;--violet:#6a3fc8;--violet-bg:#f1ecfc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa7b8;--line:#3a4557;--node:#161b22;--band:#161b22;
--blue:#6cb0ff;--blue-bg:#14263f;--green:#4cc98a;--green-bg:#10291e;--red:#ff7b86;--red-bg:#33161a;--amber:#f0a94b;--amber-bg:#33240f;--violet:#b49bff;--violet-bg:#231a3f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:40px;font-weight:800}.sub{font-size:20px;fill:var(--muted)}
.name{font-size:23px;font-weight:700;text-anchor:middle}.note{font-size:17px;fill:var(--muted);text-anchor:middle}
.label{font-size:16px;fill:var(--muted);text-anchor:middle}.point{font-size:22px;font-weight:700}.foot{font-size:16px;fill:var(--muted)}
.state{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:700;text-anchor:middle}
</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--blue)"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--green)"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red)"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--amber)"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet)"/></marker><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker></defs><rect width="1200" height="604" rx="18" fill="var(--bg)"/><text class="title" x="40" y="66">What if the job finished but the database disagrees?</text><text class="sub" x="40" y="100">Reconciliation: the job system holds the truth.</text><rect x="40" y="225" width="220" height="130" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="150" y="287.5">1. Saved run ID</text><text class="note" x="150" y="315.5">Reconcile or callback</text><rect x="310" y="225" width="240" height="130" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="430" y="287.5">2. Ask job system</text><text class="note" x="430" y="315.5">no open transaction</text><path d="M260 290H308" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><path d="M550 290C590 290 580 190 618 190" fill="none" stroke="var(--green)" stroke-width="3" marker-end="url(#m-green)"/><path d="M550 290C590 290 580 390 618 390" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><rect x="620" y="140" width="250" height="100" rx="14" fill="var(--green-bg)" stroke="var(--green)" stroke-width="2.5"/><text class="name" x="745" y="172" style="fill:var(--green)">Result known</text><text class="state" x="745" y="200">SUCCEEDED / FAILED</text><text class="note" x="745" y="224">or still running</text><rect x="620" y="340" width="250" height="100" rx="14" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.5"/><text class="name" x="745" y="372" style="fill:var(--amber)">No result</text><text class="state" x="745" y="400">503</text><text class="note" x="745" y="424">not found or unavailable</text><path d="M870 190H918" fill="none" stroke="var(--green)" stroke-width="3" marker-end="url(#m-green)"/><rect x="920" y="140" width="240" height="100" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="1040" y="187.5">Recheck and save</text><text class="note" x="1040" y="215.5">job and try together</text><path d="M870 390H918" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><rect x="920" y="340" width="240" height="100" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="1040" y="387.5">Change nothing</text><text class="note" x="1040" y="415.5">it does not prove failure</text><rect x="40" y="500" width="1120" height="84" rx="14" fill="var(--band)"/><text class="point" x="64" y="536">A failed lookup proves nothing, so saved state stays as it is.</text><text class="foot" x="64" y="564">Checks run only on Reconcile or a callback. There is no background worker.</text></svg>
