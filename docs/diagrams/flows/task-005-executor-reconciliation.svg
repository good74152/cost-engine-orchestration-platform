<rect x="32" y="948" width="1216" height="96" rx="12" fill="#e2f2f3" stroke="#65a5af"/>
<text x="56" y="986" font-size="27" font-weight="700" fill="#176270">Duplicate notifications do not change completed results.</text>
<text x="56" y="1023" font-size="22" font-weight="400" fill="#172b4d">Check again. No new attempt, no new run, no terminal rewrite.</text>
<text x="32" y="1070" font-size="18" font-weight="400" fill="#42526b">No periodic worker. Fake state is in memory. Job success does not publish the dataset.</text>
