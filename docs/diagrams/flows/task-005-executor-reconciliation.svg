<text x="84" y="587" font-size="21" font-weight="700" fill="#172b4d">Update PostgreSQL</text>
<text x="84" y="613" font-size="17" font-weight="400" fill="#42526b">Lock job → attempt → recheck.</text>
<text x="84" y="635" font-size="17" font-weight="400" fill="#42526b">Update both states → COMMIT.</text>
<rect x="32" y="654" width="360" height="92" rx="12" fill="#f0f5fc" stroke="#bacbe0"/>
<circle cx="58" cy="681" r="15" fill="#176270" stroke="#176270"/>
