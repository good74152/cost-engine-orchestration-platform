<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Two requests lock one series row. One creates the version; the other rechecks and gets 409"><style>
:root{--bg:#fff;--ink:#14213d;--muted:#5b6780;--line:#c9d2e0;--node:#fff;--band:#f4f6fa;
--blue:#1d6fd8;--blue-bg:#eaf2fd;--green:#14804a;--green-bg:#e7f6ee;--red:#c22f3d;--red-bg:#fdecee;--amber:#b35c00;--amber-bg:#fff3e2;--violet:#6a3fc8;--violet-bg:#f1ecfc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa7b8;--line:#3a4557;--node:#161b22;--band:#161b22;
--blue:#6cb0ff;--blue-bg:#14263f;--green:#4cc98a;--green-bg:#10291e;--red:#ff7b86;--red-bg:#33161a;--amber:#f0a94b;--amber-bg:#33240f;--violet:#b49bff;--violet-bg:#231a3f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:40px;font-weight:800}.sub{font-size:20px;fill:var(--muted)}
.name{font-size:23px;font-weight:700;text-anchor:middle}.note{font-size:17px;fill:var(--muted);text-anchor:middle}
.label{font-size:16px;fill:var(--muted);text-anchor:middle}.point{font-size:22px;font-weight:700}.foot{font-size:16px;fill:var(--muted)}
.state{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:700;text-anchor:middle}
</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--blue)"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--green)"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red)"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--amber)"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet)"/></marker><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker></defs><rect width="1200" height="604" rx="18" fill="var(--bg)"/><text class="title" x="40" y="66">Two requests create the same report</text><text class="sub" x="40" y="100">Dataset creation: one row lock decides the order.</text><rect x="40" y="150" width="220" height="90" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="150" y="204">Request A</text><rect x="40" y="340" width="220" height="90" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="150" y="394">Request B</text><rect x="410" y="225" width="280" height="130" rx="14" fill="var(--violet-bg)" stroke="var(--violet)" stroke-width="2.5"/><text class="name" x="550" y="276">Lock the series row</text><text class="note" x="550" y="304">one row per report,</text><text class="note" x="550" y="327">year and period</text><path d="M260 195C300 195 370 275 408 275" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><path d="M260 385C300 385 370 305 408 305" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><rect x="840" y="140" width="320" height="100" rx="14" fill="var(--green-bg)" stroke="var(--green)" stroke-width="2.5"/><text class="name" x="1000" y="172" style="fill:var(--green)">First to get the lock</text><text class="state" x="1000" y="200">DRAFT + jobs</text><text class="note" x="1000" y="224">saved in one transaction</text><rect x="840" y="340" width="320" height="100" rx="14" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2.5"/><text class="name" x="1000" y="372" style="fill:var(--red)">Second waits, rechecks</text><text class="state" x="1000" y="400">409</text><text class="note" x="1000" y="424">an active version exists</text><path d="M690 275C730 275 800 190 838 190" fill="none" stroke="var(--green)" stroke-width="3" marker-end="url(#m-green)"/><path d="M690 305C730 305 800 390 838 390" fill="none" stroke="var(--red)" stroke-width="3" marker-end="url(#m-red)"/><rect x="40" y="500" width="1120" height="84" rx="14" fill="var(--band)"/><text class="point" x="64" y="536">One request creates the version. The other waits, rechecks and gets 409.</text><text class="foot" x="64" y="564">A partial unique index also allows only one active version per report.</text></svg>
