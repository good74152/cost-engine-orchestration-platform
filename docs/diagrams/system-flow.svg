<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Create, first run, dispatch, reconcile and submit, ending in published or rejected, with retry and unknown loops"><style>
:root{--bg:#fff;--ink:#14213d;--muted:#5b6780;--line:#c9d2e0;--node:#fff;--band:#f4f6fa;
--blue:#1d6fd8;--blue-bg:#eaf2fd;--green:#14804a;--green-bg:#e7f6ee;--red:#c22f3d;--red-bg:#fdecee;--amber:#b35c00;--amber-bg:#fff3e2;--violet:#6a3fc8;--violet-bg:#f1ecfc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa7b8;--line:#3a4557;--node:#161b22;--band:#161b22;
--blue:#6cb0ff;--blue-bg:#14263f;--green:#4cc98a;--green-bg:#10291e;--red:#ff7b86;--red-bg:#33161a;--amber:#f0a94b;--amber-bg:#33240f;--violet:#b49bff;--violet-bg:#231a3f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:40px;font-weight:800}.sub{font-size:20px;fill:var(--muted)}
.name{font-size:23px;font-weight:700;text-anchor:middle}.note{font-size:17px;fill:var(--muted);text-anchor:middle}
.label{font-size:16px;fill:var(--muted);text-anchor:middle}.point{font-size:22px;font-weight:700}.foot{font-size:16px;fill:var(--muted)}
.state{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:700;text-anchor:middle}
</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--blue)"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--green)"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red)"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--amber)"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet)"/></marker><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker></defs><rect width="1200" height="600" rx="18" fill="var(--bg)"/><text class="title" x="40" y="66">From create to publish</text><text class="sub" x="40" y="100">Each step is an explicit command. Nothing publishes on its own.</text><rect x="40" y="250" width="150" height="110" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="115" y="291">Create</text><text class="note" x="115" y="319">DRAFT</text><text class="note" x="115" y="342">PENDING jobs</text><rect x="226" y="250" width="150" height="110" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="301" y="291">First Run</text><text class="note" x="301" y="319">inputs frozen</text><text class="note" x="301" y="342">BUILDING</text><rect x="412" y="250" width="150" height="110" rx="14" fill="var(--violet-bg)" stroke="var(--violet)" stroke-width="2.5"/><text class="name" x="487" y="291">Dispatch</text><text class="note" x="487" y="319">save try,</text><text class="note" x="487" y="342">then call</text><rect x="598" y="250" width="150" height="110" rx="14" fill="var(--violet-bg)" stroke="var(--violet)" stroke-width="2.5"/><text class="name" x="673" y="291">Reconcile</text><text class="note" x="673" y="319">reads the</text><text class="note" x="673" y="342">real result</text><rect x="784" y="250" width="150" height="110" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="859" y="291">Submit</text><text class="note" x="859" y="319">all succeeded</text><text class="note" x="859" y="342">VALIDATING</text><rect x="980" y="176" width="180" height="82" rx="14" fill="var(--green-bg)" stroke="var(--green)" stroke-width="2.5"/><text class="name" x="1070" y="208" style="fill:var(--green)">Publish</text><text class="state" x="1070" y="236">PUBLISHED</text><rect x="980" y="358" width="180" height="82" rx="14" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2.5"/><text class="name" x="1070" y="390" style="fill:var(--red)">Reject</text><text class="state" x="1070" y="418">REJECTED</text><path d="M190 305H224" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><path d="M376 305H410" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><path d="M562 305H596" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><path d="M748 305H782" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><path d="M934 305C974 305 940 217 978 217" fill="none" stroke="var(--green)" stroke-width="3" marker-end="url(#m-green)"/><path d="M934 305C974 305 940 399 978 399" fill="none" stroke="var(--red)" stroke-width="3" marker-end="url(#m-red)"/><rect x="462" y="130" width="236" height="84" rx="14" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2.5"/><text class="name" x="580" y="169.5">Failed</text><text class="note" x="580" y="197.5">new try, same inputs</text><path d="M673 250V216" fill="none" stroke="var(--red)" stroke-width="3" marker-end="url(#m-red)"/><path d="M487 214V248" fill="none" stroke="var(--red)" stroke-width="3" marker-end="url(#m-red)"/><rect x="462" y="396" width="236" height="84" rx="14" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.5"/><text class="name" x="580" y="435.5">Unknown</text><text class="note" x="580" y="463.5">same try, same run ID</text><path d="M487 360V394" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><path d="M673 396V362" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><rect x="40" y="504" width="1120" height="60" rx="14" fill="var(--band)"/><text class="point" x="64" y="542">A failure adds a try. An unknown result keeps the same one.</text></svg>
