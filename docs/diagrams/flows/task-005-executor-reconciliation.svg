<text x="84" y="293" font-size="21" font-weight="700" fill="#172b4d">Executor Finished</text>
<text x="84" y="319" font-size="17" font-weight="400" fill="#42526b">Executor: SUCCEEDED</text>
<text x="84" y="341" font-size="17" font-weight="400" fill="#42526b">PostgreSQL still shows RUNNING.</text>
<rect x="32" y="360" width="360" height="92" rx="12" fill="#f0f5fc" stroke="#bacbe0"/>
<circle cx="58" cy="387" r="15" fill="#176270" stroke="#176270"/>
<text x="53" y="393" font-size="17" font-weight="700" fill="#fff">3</text>
<text x="84" y="391" font-size="21" font-weight="700" fill="#172b4d">Check Execution Status</text>
<text x="84" y="417" font-size="17" font-weight="400" fill="#42526b">Manual request or callback.</text>
<text x="84" y="439" font-size="17" font-weight="400" fill="#42526b">Both use the same check service.</text>
<rect x="32" y="458" width="360" height="92" rx="12" fill="#f0f5fc" stroke="#bacbe0"/>
<circle cx="58" cy="485" r="15" fill="#176270" stroke="#176270"/>
<text x="53" y="491" font-size="17" font-weight="700" fill="#fff">4</text>
<text x="84" y="489" font-size="21" font-weight="700" fill="#172b4d">Ask the Executor</text>
<text x="84" y="515" font-size="17" font-weight="400" fill="#42526b">Use the saved DAG ID + run ID.</text>
<text x="84" y="537" font-size="17" font-weight="400" fill="#42526b">Lookup holds no DB transaction.</text>
