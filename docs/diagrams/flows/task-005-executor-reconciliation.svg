<text x="794" y="327" font-size="18" font-weight="700" fill="#176270">SUCCEEDED</text>
<rect x="430" y="435" width="320" height="52" rx="12" fill="#f0f5fc" stroke="#bacbe0"/>
<text x="450" y="469" font-size="23" font-weight="700" fill="#172b4d">Manual /reconcile</text>
<rect x="928" y="435" width="320" height="52" rx="12" fill="#f0f5fc" stroke="#bacbe0"/>
<text x="948" y="469" font-size="23" font-weight="700" fill="#172b4d">Executor callback</text>
<path class="flow-arrow" d="M 590 487 V 505 H 680 V 520" fill="none" stroke="#176270" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path class="flow-arrow" d="M 1088 487 V 505 H 1005 V 520" fill="none" stroke="#176270" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="430" y="520" width="818" height="75" rx="12" fill="#e2f2f3" stroke="#65a5af"/>
<text x="450" y="551" font-size="24" font-weight="700" fill="#176270">Same Reconciliation Service</text>
<text x="450" y="580" font-size="19" font-weight="400" fill="#42526b">Callback asks for a check; it does not prove the result.</text>
<text x="430" y="625" font-size="19" font-weight="700" fill="#176270">After lookup: lock Job → lock Attempt → recheck → save or keep → COMMIT</text>
<rect x="430" y="645" width="818" height="282" rx="12" fill="#f0f5fc" stroke="#bacbe0"/>
<text x="450" y="680" font-size="23" font-weight="700" fill="#172b4d">Other results and matching repeats</text>
<text x="450" y="717" font-size="20" font-weight="700" fill="#176270">RUNNING</text>
<text x="760" y="717" font-size="20" font-weight="400" fill="#42526b">Job RUNNING · Attempt ACCEPTED</text>
<text x="450" y="752" font-size="20" font-weight="700" fill="#176270">SUCCEEDED</text>
<text x="760" y="752" font-size="20" font-weight="400" fill="#42526b">Job + attempt SUCCEEDED</text>
<text x="450" y="787" font-size="20" font-weight="700" fill="#176270">FAILED</text>
<text x="760" y="787" font-size="20" font-weight="400" fill="#42526b">Job + attempt FAILED</text>
<text x="450" y="822" font-size="20" font-weight="700" fill="#87500f">NOT_FOUND</text>
<text x="760" y="822" font-size="20" font-weight="400" fill="#42526b">Keep local state unchanged</text>
