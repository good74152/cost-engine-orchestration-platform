<text x="760" y="857" font-size="20" font-weight="400" fill="#42526b">Keep local state unchanged</text>
<text x="450" y="892" font-size="20" font-weight="700" fill="#176270">Duplicate (same result)</text>
<text x="760" y="892" font-size="20" font-weight="400" fill="#42526b">Keep the confirmed result</text>
<text x="450" y="919" font-size="17" font-weight="400" fill="#42526b">Current attempt: check state before applying a result.</text>
