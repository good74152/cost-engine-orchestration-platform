name: Build and isolated verification
on: [push, pull_request]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: ci-disposable-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_owner -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test_owner:ci-disposable-only-password@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://test_owner:ci-disposable-only-password@127.0.0.1:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm, cache-dependency-path: 'package-lock.json'}
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm audit --audit-level=high
      - run: npm --prefix frontend audit --audit-level=high
      - run: npm run build
      - run: npm run ui:typecheck
      - run: npm run ui:test
      - run: npm run ui:build
      - run: npm run test:demo-04:typecheck
      - run: npm run test:demo-04
      - run: npm run test:demo-05a:typecheck
      - run: npm run test:demo-05a
      - run: npm run test:demo-05b1:typecheck
      - run: npm run test:demo-05b1
      - run: npm run test:demo-05b2:typecheck
      - run: npm run test:demo-05b2
      - run: npm run test:demo-05c1:typecheck
      - run: npm run test:demo-05c1
      - run: npm run test:demo-05c2:typecheck
      - run: npm run test:demo-05c2
      - run: npm run test:demo-05c3a:typecheck
      - run: npm run test:demo-05c3a
      - run: npm run test:demo-05c3b:typecheck
      - run: npm run test:demo-05c3b
      - run: npm run test:milestone
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:demo-04-containers
      - run: npm run test:demo-05d1:typecheck
      - run: npm run test:demo-05d1
      - run: npm run ui:smoke
      - run: npm run ui:smoke:workflow
      - run: npm run test:demo-05c3c:typecheck
      - run: git diff --check
  preflight-backup-restore:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: ci-disposable-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_owner -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test_owner:ci-disposable-only-password@127.0.0.1:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm, cache-dependency-path: 'package-lock.json'}
      - run: npm ci
      - run: npm run test:demo-05d2:typecheck
      - run: npm run test:demo-05d2
  operational-backup-restore:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: ci-disposable-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_owner -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test_owner:ci-disposable-only-password@127.0.0.1:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm, cache-dependency-path: 'package-lock.json'}
      - run: npm ci
      - run: npm run test:demo-05d3a:typecheck
      - run: npm run test:demo-05d3a
