<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Draft to building to validating, ending in published or rejected. Draft and building can be abandoned"><style>
:root{--bg:#fff;--ink:#14213d;--muted:#5b6780;--line:#c9d2e0;--node:#fff;--band:#f4f6fa;
--blue:#1d6fd8;--blue-bg:#eaf2fd;--green:#14804a;--green-bg:#e7f6ee;--red:#c22f3d;--red-bg:#fdecee;--amber:#b35c00;--amber-bg:#fff3e2;--violet:#6a3fc8;--violet-bg:#f1ecfc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa7b8;--line:#3a4557;--node:#161b22;--band:#161b22;
--blue:#6cb0ff;--blue-bg:#14263f;--green:#4cc98a;--green-bg:#10291e;--red:#ff7b86;--red-bg:#33161a;--amber:#f0a94b;--amber-bg:#33240f;--violet:#b49bff;--violet-bg:#231a3f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:40px;font-weight:800}.sub{font-size:20px;fill:var(--muted)}
.name{font-size:23px;font-weight:700;text-anchor:middle}.note{font-size:17px;fill:var(--muted);text-anchor:middle}
.label{font-size:16px;fill:var(--muted);text-anchor:middle}.point{font-size:22px;font-weight:700}.foot{font-size:16px;fill:var(--muted)}
.state{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:700;text-anchor:middle}
</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--blue)"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--green)"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red)"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--amber)"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet)"/></marker><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker></defs><rect width="1200" height="604" rx="18" fill="var(--bg)"/><text class="title" x="40" y="66">Who makes the final decision?</text><text class="sub" x="40" y="100">Dataset lifecycle: explicit commands, and final states never change.</text><rect x="40" y="210" width="190" height="110" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="135" y="262.5">DRAFT</text><text class="note" x="135" y="290.5">after Create</text><rect x="310" y="210" width="190" height="110" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="405" y="262.5">BUILDING</text><text class="note" x="405" y="290.5">after first Run</text><rect x="620" y="210" width="190" height="110" rx="14" fill="var(--violet-bg)" stroke="var(--violet)" stroke-width="2.5"/><text class="name" x="715" y="262.5">VALIDATING</text><text class="note" x="715" y="290.5">all jobs succeeded</text><path d="M230 265H308" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><text class="label" x="270" y="253">Run</text><path d="M500 265H618" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><text class="label" x="560" y="253">Submit</text><rect x="930" y="130" width="230" height="100" rx="14" fill="var(--green-bg)" stroke="var(--green)" stroke-width="2.5"/><text class="name" x="1045" y="177.5">PUBLISHED</text><text class="note" x="1045" y="205.5">downstream can use it</text><rect x="930" y="300" width="230" height="100" rx="14" fill="var(--red-bg)" stroke="var(--red)" stroke-width="2.5"/><text class="name" x="1045" y="347.5">REJECTED</text><text class="note" x="1045" y="375.5">kept as history</text><path d="M810 265C850 265 890 180 928 180" fill="none" stroke="var(--green)" stroke-width="3" marker-end="url(#m-green)"/><path d="M810 265C850 265 890 350 928 350" fill="none" stroke="var(--red)" stroke-width="3" marker-end="url(#m-red)"/><text class="label" x="872" y="192">Publish</text><text class="label" x="872" y="352">Reject</text><rect x="160" y="390" width="220" height="80" rx="14" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.5"/><text class="name" x="270" y="427.5">ABANDONED</text><text class="note" x="270" y="455.5">only with no open try</text><path d="M100 320V430H158" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><path d="M440 320V430H382" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><rect x="40" y="500" width="1120" height="84" rx="14" fill="var(--band)"/><text class="point" x="64" y="536">If Publish and Reject race, a row lock orders them. One wins; the other gets 409.</text><text class="foot" x="64" y="564">Successful jobs alone never publish a report.</text></svg>
