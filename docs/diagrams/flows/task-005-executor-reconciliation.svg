<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1080" width="1280" height="1080" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">Task 005 — Executor Reconciliation and Recovery — Complete Flow</title>
<desc id="flow-desc">The saved job is RUNNING and its attempt ACCEPTED. FakeExecutor changes the execution to SUCCEEDED, while PostgreSQL remains unchanged. A manual POST /calculation-jobs/:jobId/reconcile or an executor callback enters the same reconciliation service. The callback only supplies execution identity; it does not prove success or failure. The service uses saved airflowDagId plus airflowDagRunId to ask the executor outside a database transaction and row locks. After a SUCCEEDED reply it starts a transaction, locks Calculation Job then Execution Attempt, rechecks identity and state, updates both to SUCCEEDED, and commits. A matching duplicate callback checks again and keeps the confirmed result, with no new attempt or execution. RUNNING confirms ACCEPTED/RUNNING for a current non-terminal attempt; confirmed SUCCEEDED or FAILED updates both states. NOT_FOUND and UNAVAILABLE leave local state unchanged. A DISPATCHING attempt can recover to ACCEPTED/RUNNING or directly to a confirmed terminal result using the same attempt. Older callbacks cannot overwrite a newer retry; contradictory terminal facts raise an invariant error. Dataset remains BUILDING in this scenario. Only manual and callback-triggered checks exist; no periodic reconciliation worker or real Airflow adapter is shown. FakeExecutor is development/test only and its in-memory state does not survive a restart.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#176270"/></marker></defs>
