<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-label="Browser to Caddy to a Fastify backend to PostgreSQL, with a simulated job system in the backend process"><style>
:root{--bg:#fff;--ink:#14213d;--muted:#5b6780;--line:#c9d2e0;--node:#fff;--band:#f4f6fa;
--blue:#1d6fd8;--blue-bg:#eaf2fd;--green:#14804a;--green-bg:#e7f6ee;--red:#c22f3d;--red-bg:#fdecee;--amber:#b35c00;--amber-bg:#fff3e2;--violet:#6a3fc8;--violet-bg:#f1ecfc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa7b8;--line:#3a4557;--node:#161b22;--band:#161b22;
--blue:#6cb0ff;--blue-bg:#14263f;--green:#4cc98a;--green-bg:#10291e;--red:#ff7b86;--red-bg:#33161a;--amber:#f0a94b;--amber-bg:#33240f;--violet:#b49bff;--violet-bg:#231a3f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:40px;font-weight:800}.sub{font-size:20px;fill:var(--muted)}
.name{font-size:23px;font-weight:700;text-anchor:middle}.note{font-size:17px;fill:var(--muted);text-anchor:middle}
.label{font-size:16px;fill:var(--muted);text-anchor:middle}.point{font-size:22px;font-weight:700}.foot{font-size:16px;fill:var(--muted)}
.state{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:700;text-anchor:middle}
</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--blue)"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--green)"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red)"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--amber)"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet)"/></marker><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker></defs><rect width="1200" height="584" rx="18" fill="var(--bg)"/><text class="title" x="40" y="66">Where each part runs</text><text class="sub" x="40" y="100">Only Caddy is public. Everything else stays on private networks.</text><rect x="290" y="134" width="870" height="346" rx="18" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/><text class="foot" x="312" y="164">Docker Compose on one host</text><rect x="40" y="190" width="190" height="120" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="135" y="247.5">Browser</text><text class="note" x="135" y="275.5">React page</text><rect x="316" y="190" width="190" height="120" rx="14" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="2.5"/><text class="name" x="411" y="236">Caddy</text><text class="note" x="411" y="264">HTTPS</text><text class="note" x="411" y="287">serves the page</text><rect x="600" y="190" width="240" height="120" rx="14" fill="var(--violet-bg)" stroke="var(--violet)" stroke-width="2.5"/><text class="name" x="720" y="236">Backend</text><text class="note" x="720" y="264">Fastify</text><text class="note" x="720" y="287">tracks reports, jobs, tries</text><rect x="910" y="190" width="220" height="120" rx="14" fill="var(--green-bg)" stroke="var(--green)" stroke-width="2.5"/><text class="name" x="1020" y="247.5">PostgreSQL 18</text><text class="note" x="1020" y="275.5">the source of truth</text><path d="M230 250H314" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><text class="label" x="274" y="238">HTTPS</text><path d="M506 250H598" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><text class="label" x="552" y="238">/demo/*</text><path d="M840 250H908" fill="none" stroke="var(--green)" stroke-width="3" marker-end="url(#m-green)" marker-start="url(#m-green)"/><text class="label" x="874" y="238">SQL</text><rect x="560" y="368" width="320" height="92" rx="14" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.5" stroke-dasharray="8 6"/><text class="name" x="720" y="411.5">Simulated job system</text><text class="note" x="720" y="439.5">in-process, in place of Airflow</text><path d="M720 310V366" fill="none" stroke="var(--amber)" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#m-amber)" marker-start="url(#m-amber)"/><text class="label" x="732" y="344" style="text-anchor:start">start run · check result</text><rect x="40" y="504" width="1120" height="60" rx="14" fill="var(--band)"/><text class="point" x="64" y="542">The backend tracks the work. It doesn't do the calculation.</text></svg>
