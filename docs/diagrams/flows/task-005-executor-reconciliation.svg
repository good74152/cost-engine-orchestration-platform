<text x="450" y="311" font-size="22" font-weight="700" fill="#176270">Attempt: SUCCEEDED</text>
<text x="450" y="350" font-size="21" font-weight="400" fill="#42526b">Dataset: BUILDING</text>
<text x="450" y="381" font-size="18" font-weight="400" fill="#42526b">Confirmed result saved</text>
<rect x="950" y="195" width="298" height="205" rx="12" fill="#e2f2f3" stroke="#65a5af"/>
