<text x="84" y="711" font-size="17" font-weight="400" fill="#42526b">Check the same execution again.</text>
<text x="84" y="733" font-size="17" font-weight="400" fill="#42526b">Keep the same confirmed result.</text>
<text x="430" y="139" font-size="25" font-weight="700" fill="#172b4d">Executor result → Confirmed stored state</text>
<text x="430" y="168" font-size="19" font-weight="400" fill="#42526b">The executor is the source of the execution result.</text>
