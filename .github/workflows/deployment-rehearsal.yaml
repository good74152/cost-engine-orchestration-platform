name: Fresh installation deployment rehearsal
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm run test:demo-05d4:typecheck
      - run: npm run test:demo-05d4:unit
      - run: git diff --check
  rehearsal:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [happy-path, backend-startup-failure]
    # Each leg gets a fresh VM and Docker daemon, with no shared services or real credentials.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm run test:demo-05d4:rehearsal -- --scenario '${{ matrix.scenario }}'
