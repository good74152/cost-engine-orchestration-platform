<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Depreciation freezes CAPEX v1 at first run. Later jobs and retries keep v1 after v2 is published. A new version picks v2"><style>
:root{--bg:#fff;--ink:#14213d;--muted:#5b6780;--line:#c9d2e0;--node:#fff;--band:#f4f6fa;
--blue:#1d6fd8;--blue-bg:#eaf2fd;--green:#14804a;--green-bg:#e7f6ee;--red:#c22f3d;--red-bg:#fdecee;--amber:#b35c00;--amber-bg:#fff3e2;--violet:#6a3fc8;--violet-bg:#f1ecfc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--muted:#9aa7b8;--line:#3a4557;--node:#161b22;--band:#161b22;
--blue:#6cb0ff;--blue-bg:#14263f;--green:#4cc98a;--green-bg:#10291e;--red:#ff7b86;--red-bg:#33161a;--amber:#f0a94b;--amber-bg:#33240f;--violet:#b49bff;--violet-bg:#231a3f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.title{font-size:40px;font-weight:800}.sub{font-size:20px;fill:var(--muted)}
.name{font-size:23px;font-weight:700;text-anchor:middle}.note{font-size:17px;fill:var(--muted);text-anchor:middle}
.label{font-size:16px;fill:var(--muted);text-anchor:middle}.point{font-size:22px;font-weight:700}.foot{font-size:16px;fill:var(--muted)}
.state{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:700;text-anchor:middle}
</style><defs><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--blue)"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--green)"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red)"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--amber)"/></marker><marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet)"/></marker><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker></defs><rect width="1200" height="604" rx="18" fill="var(--bg)"/><text class="title" x="40" y="66">What if upstream data changes mid-build?</text><text class="sub" x="40" y="100">Frozen inputs: the first Run decides, once, for the whole version.</text><rect x="40" y="140" width="300" height="110" rx="14" fill="var(--green-bg)" stroke="var(--green)" stroke-width="2.5"/><text class="name" x="190" y="192.5">CAPEX v1</text><text class="note" x="190" y="220.5">PUBLISHED</text><rect x="430" y="140" width="320" height="110" rx="14" fill="var(--violet-bg)" stroke="var(--violet)" stroke-width="2.5"/><text class="name" x="590" y="192.5">DPR version 1</text><text class="note" x="590" y="220.5">first Run freezes CAPEX v1</text><rect x="840" y="140" width="320" height="110" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="1000" y="192.5">Its later jobs and retries</text><text class="note" x="1000" y="220.5">stay on CAPEX v1</text><path d="M340 195H428" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><path d="M750 195H838" fill="none" stroke="var(--blue)" stroke-width="3" marker-end="url(#m-blue)"/><rect x="40" y="330" width="300" height="110" rx="14" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.5"/><text class="name" x="190" y="382.5">CAPEX v2</text><text class="note" x="190" y="410.5">published later</text><rect x="430" y="330" width="320" height="110" rx="14" fill="var(--violet-bg)" stroke="var(--violet)" stroke-width="2.5"/><text class="name" x="590" y="382.5">DPR version 2</text><text class="note" x="590" y="410.5">first Run freezes CAPEX v2</text><rect x="840" y="330" width="320" height="110" rx="14" fill="var(--node)" stroke="var(--line)" stroke-width="2.5"/><text class="name" x="1000" y="382.5">Its later jobs and retries</text><text class="note" x="1000" y="410.5">stay on CAPEX v2</text><path d="M340 385H428" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><path d="M750 385H838" fill="none" stroke="var(--amber)" stroke-width="3" marker-end="url(#m-amber)"/><rect x="40" y="500" width="1120" height="84" rx="14" fill="var(--band)"/><text class="point" x="64" y="536">Every job and retry in a version uses the same inputs.</text><text class="foot" x="64" y="564">Newer upstream data needs a new version. Inputs are frozen at first Run, not at Create.</text></svg>
