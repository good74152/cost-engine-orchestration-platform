<text x="970" y="272" font-size="21" font-weight="400" fill="#42526b">Execution:</text>
<text x="970" y="311" font-size="27" font-weight="700" fill="#176270">SUCCEEDED</text>
<text x="970" y="381" font-size="18" font-weight="400" fill="#42526b">Development / test only</text>
<path class="flow-arrow" d="M 765 265 H 950" fill="none" stroke="#176270" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
